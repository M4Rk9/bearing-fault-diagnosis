name: M4 data validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-m4.txt
      - run: pip install -r requirements-m4.txt
      - run: python -m unittest discover -s tests -v
  real-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-m4.txt
      - run: pip install -r requirements-m4.txt
      - name: Acquire official IR007 0 HP recording
        run: python -m src.data_pipeline acquire --manifest data/manifests/real_record_example.json --output data/example.lock.json
      - name: Validate recording and export both branches
        run: python -m src.data_pipeline prepare --manifest data/example.lock.json --output data/processed/real-example --record-example
      - name: Reproduce raw waveform and spectrum
        run: python -m src.plot_record --manifest data/example.lock.json --record-id cwru-105-DE --output data/processed/real-example/record.png
      - name: Acquire and hash all candidate cohort files
        run: python -m src.data_pipeline acquire --manifest data/manifests/cwru_007_candidates.json --output data/processed/real-example/cohort.acquisition.json
      - name: Record evidence in job log
        run: cat data/processed/real-example/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: m4-real-record-evidence
          path: |
            data/processed/real-example/summary.json
            data/processed/real-example/manifest.json
            data/processed/real-example/record.png
            data/processed/real-example/record.json
            data/processed/real-example/cohort.acquisition.json
          if-no-files-found: error
          retention-days: 30
